; reposettings.ini — medföljer repot, ändra inte för personliga inställningar
; Dessa används av Expanto vid first-run för att erbjuda inbyggda ordlistor.
; Sökvägar är relativa till skriptmappen (A_ScriptDir).

[bundle1]
label = Svenska (grundordlista, ~400k ord)
files = lib\words\words_sv.txt
default = 1

[bundle2]
label = Engelska (~370k ord)
files = lib\words\words_en.txt
default = 0

[bundle3]
label = Svenska fullständig — Runeberg (~600k ord, inkl. ordböcker)
files = lib\words\runeberg_stava.txt|lib\words\runeberg_ss100.txt|lib\words\runeberg_frykholm.txt|lib\words\runeberg_frsvenska.txt|lib\words\runeberg_swnet.txt
default = 0
